[package]
name = "dome-browser"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
servo = { workspace = true, features = ["baked-in-resources", "js_jit", "webxr", "clipboard", "webcrypto"] }
image = { workspace = true }
webxr = { workspace = true }
webxr-api = { workspace = true }
surfman = { workspace = true }
glow = { workspace = true }
euclid = { workspace = true }
dpi = { workspace = true }
url = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }

adblock = "=0.13.3"
sha2 = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
cc = { workspace = true }

[[bin]]
name = "dome-browser"
path = "src/main.rs"
