<!doctype html><meta charset="utf-8"><title>WebGL buffer and vertex-array GC lifetime</title>
<script>
(async()=>{
 const params=new URLSearchParams(location.search),mode=params.get('mode')||'webgl1',order=params.get('order')||'buffers-first',canvas=document.createElement('canvas');canvas.width=canvas.height=16;document.documentElement.append(canvas);
 const gl=canvas.getContext(mode==='webgl2'?'webgl2':'webgl',{preserveDrawingBuffer:true}),checks=[],retained=[];
 if(!gl)throw Error(mode+' context unavailable');
 const ext=mode==='webgl2'?null:gl.getExtension('OES_vertex_array_object');if(mode!=='webgl2'&&!ext)throw Error('OES_vertex_array_object unavailable');
 const create=()=>mode==='webgl2'?gl.createVertexArray():ext.createVertexArrayOES(),bind=vao=>mode==='webgl2'?gl.bindVertexArray(vao):ext.bindVertexArrayOES(vao),remove=vao=>mode==='webgl2'?gl.deleteVertexArray(vao):ext.deleteVertexArrayOES(vao);
 const seconds=Math.max(0,Math.min(900,Number(params.get('seconds'))||0)),started=performance.now();
 let arrays=0,batches=0;
 for(let batch=0;batch<48||performance.now()-started<seconds*1000;batch++){
  for(let i=0;i<32;i++){
   let attribute,element,vao;if(order==='vao-first'){vao=create();attribute=gl.createBuffer();element=gl.createBuffer()}else{attribute=gl.createBuffer();element=gl.createBuffer();vao=create()}bind(vao);
   gl.bindBuffer(gl.ARRAY_BUFFER,attribute);gl.bufferData(gl.ARRAY_BUFFER,65536,gl.STATIC_DRAW);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,element);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,128,gl.STATIC_DRAW);
   bind(null);gl.bindBuffer(gl.ARRAY_BUFFER,null);
   if(i%3===0){gl.deleteBuffer(attribute);gl.deleteBuffer(element)}
   if(i%5===0)remove(vao);
   if(i===1&&batch<8)retained.push(attribute,element);
   arrays++;
  }
  // Yield so native collection checkpoints can run after each allocation batch.
  if(batch%8===0)await fetch('/progress',{method:'POST',body:JSON.stringify({mode,batch,arrays})});
  batches++;await new Promise(resolve=>setTimeout(resolve,seconds?100:20));
 }
 checks.push({name:'all vertex array allocation/release batches complete',passed:batches>=48&&arrays===batches*32});
 checks.push({name:'buffers retained by author code survive unreachable vertex arrays',passed:retained.length===16&&retained.every(buffer=>gl.isBuffer(buffer))});
 checks.push({name:'WebGL operations remain valid after collection pressure',passed:gl.getError()===gl.NO_ERROR});
 gl.clearColor(0,1,0,1);gl.clear(gl.COLOR_BUFFER_BIT);const pixel=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
 checks.push({name:'context renders after collection pressure',passed:pixel[0]===0&&pixel[1]===255&&pixel[2]===0&&pixel[3]===255});
 retained.forEach(buffer=>gl.deleteBuffer(buffer));
 fetch('/report',{method:'POST',body:JSON.stringify({checks,diagnostics:{mode,order,arrays,batches,elapsedMs:performance.now()-started,pixel:Array.from(pixel)},scope:'WebGL1 OES or WebGL2 VAOs reference attribute/index buffers, with pending explicit deletion, live author buffers and native GC pressure. No privileged API exposed to content.'})});
})().catch(error=>fetch('/report',{method:'POST',body:JSON.stringify({checks:[{name:'fixture completed',passed:false,error:String(error)}]})}));
</script>
