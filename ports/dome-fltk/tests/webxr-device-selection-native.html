<!doctype html><meta charset=utf-8><title>Native XR compatibility generations</title><body>
<script>
let order=0,count=0;const post=(type,data)=>fetch('/event',{method:'POST',body:JSON.stringify({order:++order,type,data})});
const check=(passed,name)=>{count++;post('check',{passed:!!passed,name});if(!passed)throw Error(name)};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function wait(fn){const end=performance.now()+5000;while(performance.now()<end){if(await fn())return;await sleep(25)}throw Error('Native compatibility condition timed out')}
async function control(op){const response=await fetch('/host-control',{method:'POST',body:JSON.stringify({op})});if(!(await response.json()).ok)throw Error('Host command failed')}
const ops=()=>fetch('/host-ops').then(r=>r.json());const packets=[];addEventListener('message',event=>{if(event.data?.selectionObserver)packets.push(event.data)});
async function main(){
 post('ready',{deviceSelection:true});await control('active');
 const contexts=['webgl','webgl2'].map(version=>{const canvas=document.createElement('canvas');canvas.width=16;canvas.height=16;document.body.append(canvas);return canvas.getContext(version)});
 check(contexts.every(Boolean),'Both native WebGL versions are available');await Promise.all(contexts.map(gl=>gl.makeXRCompatible()));
 check(contexts.every(gl=>gl.getContextAttributes().xrCompatible),'Both contexts become compatible without accessing navigator.xr');
 const textures=contexts.map(gl=>{const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);return texture});
 await control('replace-endpoint');await wait(()=>contexts.every(gl=>!gl.getContextAttributes().xrCompatible));
 check(contexts.every((gl,index)=>!gl.isContextLost()&&gl.isTexture(textures[index])),'Native device replacement invalidates compatibility while preserving ordinary GL resources');
 await Promise.all(contexts.map(gl=>gl.makeXRCompatible()));check(contexts.every(gl=>gl.getContextAttributes().xrCompatible),'Contexts can target the replacement device');
 await control('suspend');await wait(()=>contexts.every(gl=>!gl.getContextAttributes().xrCompatible));
 check(contexts.every(gl=>!gl.isContextLost()),'Native suspension clears compatibility without losing the graphics contexts');
 await control('active');await Promise.all(contexts.map(gl=>gl.makeXRCompatible()));
 const lost=contexts.map(gl=>new Promise(resolve=>gl.canvas.addEventListener('webglcontextlost',resolve,{once:true})));contexts.forEach(gl=>gl.getExtension('WEBGL_lose_context').loseContext());await Promise.all(lost);await sleep(800);
 const stopped=(await ops()).length;await sleep(700);check((await ops()).length===stopped,'Lost contexts stop native observation when no XR listeners exist');
 const frame=document.createElement('iframe');frame.allow='xr-spatial-tracking *';frame.src='/selection-observer?tag=child';document.body.append(frame);
 await wait(()=>packets.some(packet=>packet.tag==='child'&&packet.ready));check(packets.at(-1).compatible,'A child document independently establishes compatible contexts');
 frame.contentWindow.postMessage({selectionCommand:'idle'},'*');await wait(()=>packets.some(packet=>packet.tag==='idle'&&packet.ready));await sleep(800);
 const inactive=(await ops()).length;await control('replace-endpoint');await sleep(700);check((await ops()).length===inactive,'Inactive history documents do not poll compatibility or native availability');
 frame.contentWindow.postMessage({selectionCommand:'back'},'*');await wait(()=>packets.some(packet=>packet.tag==='child'&&packet.pageshows===2));
 await wait(()=>frame.contentWindow.selectionContexts?.every(gl=>!gl.getContextAttributes().xrCompatible));
 check(frame.contentWindow.selectionContexts.every(gl=>!gl.isContextLost()),'History restoration reconciles a replacement device without losing GL resources');
 await sleep(800);const reconciled=(await ops()).length;await sleep(700);check((await ops()).length===reconciled,'Incompatible restored contexts stop observation after baseline reconciliation');
 frame.contentWindow.postMessage({selectionCommand:'rearm'},'*');await wait(()=>packets.some(packet=>packet.rearmed&&packet.compatible));
 check(packets.at(-1).resources,'Rearming a retained document preserves its textures');frame.remove();await sleep(800);
 const removed=(await ops()).length;await sleep(700);check((await ops()).length===removed,'Destroying the compatible child stops the last native observer');
 check((await ops()).every(op=>op==='hello'),'Compatibility observation uses only capability handshakes');post('done',{count,kind:'device-selection'});
}
main().catch(error=>post('error',{message:String(error)+'\n'+error.stack}));
</script>
