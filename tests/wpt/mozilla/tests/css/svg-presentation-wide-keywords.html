<!doctype html>
<meta charset="utf-8">
<title>CSS-wide keywords in SVG presentation attributes</title>
<link rel="help" href="https://svgwg.org/svg2-draft/styling.html#PresentationAttributes">
<link rel="match" href="svg-presentation-wide-keywords-ref.html">
<meta name="assert" content="SVG presentation attributes accept CSS-wide keywords, including explicit inheritance of non-inherited gradient-stop properties and initial fill.">
<style>body { margin: 0 } svg { display: inline-block; vertical-align: top; width: 100px; height: 100px }</style>
<svg viewBox="0 0 100 100"><defs><linearGradient id="color" stop-color="green"><stop offset="0" stop-color="inherit"/><stop offset="1" stop-color="inherit"/></linearGradient></defs><rect width="100" height="100" fill="url(#color)"/></svg><svg viewBox="0 0 100 100"><defs><linearGradient id="opacity" stop-color="green" stop-opacity="0"><stop offset="0" stop-color="green" stop-opacity="inherit"/><stop offset="1" stop-color="green" stop-opacity="inherit"/></linearGradient></defs><rect width="100" height="100" fill="url(#opacity)"/></svg><svg viewBox="0 0 100 100" fill="green"><rect width="100" height="100" fill="initial"/></svg><svg viewBox="0 0 100 100" fill="green"><rect width="100" height="100" fill="unset"/></svg>
