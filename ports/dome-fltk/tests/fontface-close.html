<!doctype html><title>Pending font loading shutdown</title><script>
addEventListener('load',()=>{try{const face=new FontFace('PendingFontClose','url(/font-api.ttf?delay=2&pending-close)');document.fonts.add(face);const task=document.fonts.load('16px PendingFontClose');task.catch(()=>{});setTimeout(()=>{fetch('/report',{method:'POST',body:JSON.stringify({checks:[{name:'matched font request remains pending at close',passed:face.status==='loading'}]})})},100)}catch(e){fetch('/report',{method:'POST',body:JSON.stringify({checks:[{name:'pending font API works',passed:false,error:String(e)}]})})}});</script>
