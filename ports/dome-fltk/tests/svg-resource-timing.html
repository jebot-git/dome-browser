<!doctype html><meta charset=utf-8><title>Repeated SVG instance snapshots</title>
<style>body{margin:0;background:white}.tile{position:absolute;top:20px;width:60px;height:60px}.tint{fill:var(--paint,red)} #timing-control{position:absolute;left:620px;top:0;width:2px;height:2px;background-image:url(/timing-control.svg)}</style><div id=timing-control></div>
<svg width="0" height="0" style="position:absolute"><defs>
 <g id="sprite"><rect class="tint" width="60" height="60"/></g>
 <linearGradient id="empty" href="#empty"/>
 <g id="empty-shape"><rect fill="url(#empty) red" width="60" height="60"/></g>
</defs></svg>
<svg class="tile" style="left:20px"><use class="host" href="#sprite"/></svg>
<svg class="tile" style="left:100px"><use class="host" href="#sprite"/></svg>
<svg class="tile" style="left:180px"><use class="host" href="#sprite"/></svg>
<svg class="tile" style="left:260px"><use href="#empty-shape"/></svg>
<script>
addEventListener('load',()=>{
 const green='rgb(20,180,90)',blue='rgb(30,90,220)',hosts=[...document.querySelectorAll('.host')],start=performance.now();let frames=0;
 const update=color=>hosts.forEach(host=>host.style.setProperty('--paint',color));
 function tick(){
  frames++;update(frames%2?green:blue);
  if(performance.now()-start<1000){requestAnimationFrame(tick);return}
  update(green);
  setTimeout(()=>{const entries=performance.getEntriesByType('resource');const privateEntries=entries.filter(entry=>entry.name.startsWith('data:image/svg+xml;base64,'));fetch('/report',{method:'POST',body:JSON.stringify({frames,elapsed:performance.now()-start,privateSnapshotResourceTimings:privateEntries.length,resourceTimingEntries:entries.length,checks:[{name:'internal SVG snapshots do not appear in Resource Timing',passed:privateEntries.length===0},{name:'author CSS image still has Resource Timing',passed:entries.some(entry=>entry.name===new URL('/timing-control.svg',location.href).href&&entry.initiatorType==='css')},
   {name:'snapshot animation makes sustained progress',passed:frames>=10},
   {name:'connected use count stays bounded',passed:document.querySelectorAll('svg use').length===4},
   {name:'instance IDs are not exposed in the document',passed:document.querySelector('[id^="dome-instance-"]')===null},
   {name:'source style remains untouched',passed:document.querySelector('#sprite rect').getAttribute('style')===null},
   {name:'source resource IDs remain unique',passed:document.querySelectorAll('#sprite').length===1&&document.querySelectorAll('#empty').length===1}
  ]})})},1500);
 }
 requestAnimationFrame(tick);
});
</script>
