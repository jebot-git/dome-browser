<!doctype html><meta charset="utf-8"><title>WebGL context lifecycle</title>
<style>body{background:#243344;color:white;font:16px monospace}canvas{width:192px;height:144px;margin:8px}</style>
<h1>WebGL context lifecycle</h1><pre id="status">Running isolated context checks…</pre>
<script>
'use strict';
const checks=[],suites=[],retained=[];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function check(value,name){checks.push({name,passed:!!value});if(!value)throw new Error(name);}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function eventOnce(target,name){return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('Timed out: '+name)),6000);target.addEventListener(name,e=>{clearTimeout(t);resolve(e);},{once:true});});}
function parameter(gl,name){const v=gl.getParameter(gl[name]);return ArrayBuffer.isView(v)?Array.from(v):v;}
function defaults(gl){
 const names=['ACTIVE_TEXTURE','ARRAY_BUFFER_BINDING','ELEMENT_ARRAY_BUFFER_BINDING','FRAMEBUFFER_BINDING','RENDERBUFFER_BINDING','CURRENT_PROGRAM','PACK_ALIGNMENT','UNPACK_ALIGNMENT','UNPACK_FLIP_Y_WEBGL','UNPACK_PREMULTIPLY_ALPHA_WEBGL','UNPACK_COLORSPACE_CONVERSION_WEBGL','COLOR_CLEAR_VALUE','COLOR_WRITEMASK','DEPTH_CLEAR_VALUE','DEPTH_WRITEMASK','BLEND','CULL_FACE','DEPTH_TEST','SCISSOR_TEST','DITHER','TEXTURE_BINDING_2D'];
 if(gl instanceof WebGL2RenderingContext)names.push('READ_FRAMEBUFFER_BINDING','COPY_READ_BUFFER_BINDING','COPY_WRITE_BUFFER_BINDING','PIXEL_PACK_BUFFER_BINDING','PIXEL_UNPACK_BUFFER_BINDING','TRANSFORM_FEEDBACK_BINDING','TRANSFORM_FEEDBACK_BUFFER_BINDING','UNIFORM_BUFFER_BINDING','VERTEX_ARRAY_BINDING','PACK_ROW_LENGTH','PACK_SKIP_PIXELS','PACK_SKIP_ROWS','UNPACK_ROW_LENGTH','UNPACK_SKIP_PIXELS','UNPACK_SKIP_ROWS','UNPACK_IMAGE_HEIGHT','UNPACK_SKIP_IMAGES','RASTERIZER_DISCARD','SAMPLER_BINDING','READ_BUFFER');
 return Object.fromEntries(names.map(name=>[name,parameter(gl,name)]));
}
function resources(gl){
 const buffer=gl.createBuffer(),texture=gl.createTexture(),framebuffer=gl.createFramebuffer(),renderbuffer=gl.createRenderbuffer();
 const program=gl.createProgram(),shader=gl.createShader(gl.VERTEX_SHADER);
 gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,1,2,3]),gl.STATIC_DRAW);
 gl.bindTexture(gl.TEXTURE_2D,texture);gl.bindRenderbuffer(gl.RENDERBUFFER,renderbuffer);gl.renderbufferStorage(gl.RENDERBUFFER,gl.RGBA4,2,2);gl.bindFramebuffer(gl.FRAMEBUFFER,framebuffer);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 const result={buffer,texture,framebuffer,renderbuffer,program,shader};
 if(gl instanceof WebGL2RenderingContext){
  result.vao=gl.createVertexArray();gl.bindVertexArray(result.vao);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bindVertexArray(null);
  result.sampler=gl.createSampler();gl.bindSampler(0,result.sampler);
  result.tf=gl.createTransformFeedback();gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK,result.tf);
  result.query=gl.createQuery();gl.beginQuery(gl.ANY_SAMPLES_PASSED,result.query);gl.endQuery(gl.ANY_SAMPLES_PASSED);gl.getQueryParameter(result.query,gl.QUERY_RESULT_AVAILABLE);
  result.sync=gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE,0);gl.clientWaitSync(result.sync,0,0);gl.getSyncParameter(result.sync,gl.SYNC_STATUS);
  // Use distinct objects because an element buffer cannot later become a generic buffer.
  for(const target of [gl.COPY_READ_BUFFER,gl.COPY_WRITE_BUFFER,gl.PIXEL_PACK_BUFFER,gl.PIXEL_UNPACK_BUFFER,gl.UNIFORM_BUFFER,gl.TRANSFORM_FEEDBACK_BUFFER]){const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,64,gl.STATIC_DRAW);retained.push(b);}
  gl.bindBufferBase(gl.UNIFORM_BUFFER,0,gl.createBuffer());gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,gl.createBuffer());
 }
 return result;
}
function render(gl,label){
 const v=gl instanceof WebGL2RenderingContext;
 const shader=(type,body)=>{const s=gl.createShader(type);gl.shaderSource(s,body);gl.compileShader(s);check(gl.getShaderParameter(s,gl.COMPILE_STATUS),label+' shader compiles');return s;};
 const vs=shader(gl.VERTEX_SHADER,(v?'#version 300 es\nin':'attribute')+' vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
 const fs=shader(gl.FRAGMENT_SHADER,(v?'#version 300 es\n':'')+'precision mediump float;'+(v?'out vec4 result;':'')+'void main(){'+(v?'result':'gl_FragColor')+'=vec4(0.,1.,0.,1.);}');
 const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);check(gl.getProgramParameter(p,gl.LINK_STATUS),label+' program links');gl.useProgram(p);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const index=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(index);gl.vertexAttribPointer(index,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);
 const pixels=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixels);check(same(Array.from(pixels),[0,255,0,255]),label+' fresh resources draw GPU pixels');check(gl.getError()===gl.NO_ERROR,label+' rendering has no GL error');
 retained.push(p,vs,fs,b);
}
async function lifecycle(version,offscreen){
 const name=version+(offscreen?' offscreen':' canvas');
 const canvas=offscreen?new OffscreenCanvas(32,24):Object.assign(document.createElement('canvas'),{width:32,height:24});if(!offscreen)document.body.appendChild(canvas);
 const gl=canvas.getContext(version,{antialias:false,preserveDrawingBuffer:true});check(!!gl,name+' context available');const ext=gl.getExtension('WEBGL_lose_context');check(!!ext,name+' loss extension available');
 if(version==='webgl2')check(gl.getExtension('OES_texture_float')===null&&gl.getExtension('OES_vertex_array_object')===null&&gl.getExtension('ANGLE_instanced_arrays')===null,name+' extension lookup rejects WebGL1-only interfaces');
 const baseline=defaults(gl);check(gl.getError()===gl.NO_ERROR,name+' initial state queries are valid');let lost=0,restored=0;
 for(let cycle=0;cycle<3;cycle++){
  const label=name+' cycle '+cycle;render(gl,label+' before loss');const old=resources(gl);retained.push(old);
  gl.enable(gl.BLEND);gl.enable(gl.DEPTH_TEST);gl.enable(gl.SCISSOR_TEST);gl.disable(gl.DITHER);gl.clearColor(.1,.2,.3,.4);gl.colorMask(false,true,false,true);gl.depthMask(false);gl.clearDepth(.3);gl.scissor(2,3,4,5);gl.viewport(3,4,5,6);gl.pixelStorei(gl.PACK_ALIGNMENT,1);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
  if(version==='webgl2'){gl.pixelStorei(gl.PACK_ROW_LENGTH,8);gl.pixelStorei(gl.PACK_SKIP_ROWS,1);gl.pixelStorei(gl.PACK_SKIP_PIXELS,1);gl.pixelStorei(gl.UNPACK_ROW_LENGTH,9);gl.pixelStorei(gl.UNPACK_SKIP_ROWS,1);gl.pixelStorei(gl.UNPACK_SKIP_PIXELS,1);gl.pixelStorei(gl.UNPACK_IMAGE_HEIGHT,10);gl.pixelStorei(gl.UNPACK_SKIP_IMAGES,1);gl.enable(gl.RASTERIZER_DISCARD);}
  check(gl.getError()===gl.NO_ERROR,label+' pre-loss resource and state setup is valid');
  const pending=eventOnce(canvas,'webglcontextlost');let eventError=null;
  canvas.addEventListener('webglcontextlost',e=>{try{lost++;check(e.isTrusted&&e.cancelable&&!e.bubbles&&e.statusMessage==='',label+' trusted cancellable loss event');check(gl.isContextLost(),label+' context lost during event');e.preventDefault();ext.restoreContext();check(gl.getError()===gl.INVALID_OPERATION,label+' restoration is rejected until loss event finishes');}catch(error){eventError=error;}},{once:true});
  ext.loseContext();check(gl.isContextLost(),label+' loss flag changes synchronously');check(lost===cycle,label+' loss event is asynchronous');check(gl.getError()===gl.CONTEXT_LOST_WEBGL&&gl.getError()===gl.NO_ERROR,label+' loss error is reported exactly once');
  ext.restoreContext();check(gl.getError()===gl.INVALID_OPERATION,label+' restoration before event is rejected');ext.loseContext();check(gl.getError()===gl.INVALID_OPERATION,label+' duplicate loss is rejected');
  check(gl.getContextAttributes()===null&&gl.getSupportedExtensions()===null&&gl.getExtension('WEBGL_lose_context')===null,label+' lost queries return null');
  check(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_UNSUPPORTED&&gl.getAttribLocation(old.program,'p')===-1,label+' special lost-query return values');
  const sentinels=new Uint8Array([7,8,9,10]);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,sentinels);gl.bindBuffer(999,old.buffer);gl.clear(0xffffffff);gl.bufferData(999,-1,999);check(same(Array.from(sentinels),[7,8,9,10])&&gl.getError()===gl.NO_ERROR,label+' lost commands do not mutate output or generate errors');
  const invalid=[gl.createBuffer(),gl.createTexture(),gl.createFramebuffer(),gl.createRenderbuffer(),gl.createProgram(),gl.createShader(gl.VERTEX_SHADER)];
  check(invalid.every(Boolean)&&!gl.isBuffer(invalid[0])&&!gl.isTexture(invalid[1])&&!gl.isFramebuffer(invalid[2])&&!gl.isRenderbuffer(invalid[3])&&!gl.isProgram(invalid[4])&&!gl.isShader(invalid[5]),label+' creations while lost return permanently invalid objects');retained.push(...invalid);
  if(version==='webgl2'){const invalid2=[gl.createVertexArray(),gl.createSampler(),gl.createQuery(),gl.createTransformFeedback()];check(invalid2.every(Boolean)&&!gl.isVertexArray(invalid2[0])&&!gl.isSampler(invalid2[1])&&!gl.isQuery(invalid2[2])&&!gl.isTransformFeedback(invalid2[3]),label+' WebGL2 creations while lost remain invalid');retained.push(...invalid2);check(gl.clientWaitSync(old.sync,0,0)===gl.WAIT_FAILED&&gl.getUniformBlockIndex(old.program,'block')===gl.INVALID_INDEX,label+' WebGL2 lost-query sentinels');}
  canvas.width+=3;canvas.height+=1;check(gl.isContextLost()&&gl.drawingBufferWidth===0&&gl.drawingBufferHeight===0,label+' resize while lost does not recreate the context');
  const compatibility=gl.makeXRCompatible().then(()=>false,e=>e.name==='InvalidStateError');await pending;if(eventError)throw eventError;check(await compatibility,label+' XR compatibility rejects lost context');
  const restoredEvent=eventOnce(canvas,'webglcontextrestored');ext.restoreContext();ext.restoreContext();check(gl.isContextLost()&&restored===cycle&&gl.getError()===gl.NO_ERROR,label+' restoration and repeated request remain asynchronous');
  const event=await restoredEvent;restored++;check(event.isTrusted&&event.cancelable&&!event.bubbles&&!gl.isContextLost(),label+' trusted restoration event exposes a usable context');
  const actual=defaults(gl);check(same(actual,baseline),label+' all cached and native bindings reset to creation defaults');check(same(parameter(gl,'VIEWPORT'),[0,0,canvas.width,canvas.height])&&same(parameter(gl,'SCISSOR_BOX'),[0,0,canvas.width,canvas.height]),label+' restored viewport and scissor use the new canvas size');
  check(gl.drawingBufferWidth===canvas.width&&gl.drawingBufferHeight===canvas.height,label+' restored drawing buffer follows lost-time resize');check(gl.getContextAttributes().preserveDrawingBuffer===true&&gl.getContextAttributes().antialias===false&&gl.getContextAttributes().xrCompatible===false,label+' creation attributes preserved and XR flag cleared');check(gl.getExtension('WEBGL_lose_context')===ext,label+' loss extension object survives restoration');
  for(const [object,fn] of [[old.buffer,()=>gl.bindBuffer(gl.ARRAY_BUFFER,old.buffer)],[old.texture,()=>gl.bindTexture(gl.TEXTURE_2D,old.texture)],[old.framebuffer,()=>gl.bindFramebuffer(gl.FRAMEBUFFER,old.framebuffer)],[old.renderbuffer,()=>gl.bindRenderbuffer(gl.RENDERBUFFER,old.renderbuffer)],[old.program,()=>gl.useProgram(old.program)],[old.shader,()=>gl.compileShader(old.shader)],[invalid[0],()=>gl.bindBuffer(gl.ARRAY_BUFFER,invalid[0])]]){fn();check(gl.getError()===gl.INVALID_OPERATION,label+' old object cannot address restored native resources');}
  if(version==='webgl2'){for(const fn of [()=>gl.bindVertexArray(old.vao),()=>gl.bindSampler(0,old.sampler),()=>gl.beginQuery(gl.ANY_SAMPLES_PASSED,old.query),()=>gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK,old.tf)]){fn();check(gl.getError()===gl.INVALID_OPERATION,label+' old WebGL2 object rejected');}check(gl.getIndexedParameter(gl.UNIFORM_BUFFER_BINDING,0)===null&&gl.getIndexedParameter(gl.TRANSFORM_FEEDBACK_BUFFER_BINDING,0)===null,label+' indexed buffer bindings reset');}
  render(gl,label+' after restoration');ext.restoreContext();check(gl.getError()===gl.INVALID_OPERATION,label+' restoring a live context is rejected');
 }
 check(lost===3&&restored===3,name+' exactly one event pair per loss cycle');
 // Explicitly release the final graphics context; do not restore without consent.
 const finalLoss=eventOnce(canvas,'webglcontextlost');ext.loseContext();await finalLoss;ext.restoreContext();check(gl.getError()===gl.CONTEXT_LOST_WEBGL&&gl.getError()===gl.INVALID_OPERATION,name+' uncancelled loss cannot restore');await sleep(30);check(gl.isContextLost(),name+' uncancelled context remains lost');if(!offscreen)canvas.remove();
}
async function presentation(){
 const canvas=Object.assign(document.createElement('canvas'),{width:128,height:96});
 canvas.style.cssText='position:fixed;left:32px;top:160px;width:128px;height:96px;margin:0';document.body.appendChild(canvas);
 const gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});const ext=gl.getExtension('WEBGL_lose_context');gl.clearColor(1,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 const lost=eventOnce(canvas,'webglcontextlost');canvas.addEventListener('webglcontextlost',e=>e.preventDefault(),{once:true});ext.loseContext();await lost;await sleep(0);
 const restored=eventOnce(canvas,'webglcontextrestored');ext.restoreContext();await restored;gl.clearColor(0,1,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));await sleep(200);
 check(!gl.isContextLost()&&gl.getError()===gl.NO_ERROR,'Restored context submits a new green canvas image for native capture');
}
async function upstream(){
 for(const version of [1,2])for(const name of ['context-lost','context-lost-restored']){
  const frame=document.createElement('iframe');frame.width=400;frame.height=200;const tag=name+'-webgl'+version;
  const result=new Promise((resolve,reject)=>{const timer=setTimeout(()=>{removeEventListener('message',handler);reject(new Error('Upstream timed out: '+tag));},15000);function handler(e){if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data.tag!==tag)return;clearTimeout(timer);removeEventListener('message',handler);resolve(e.data);}addEventListener('message',handler);});
  frame.src='/webgl/conformance/context/'+name+'.html?webglVersion='+version+'&fixtureTag='+tag;document.body.appendChild(frame);const report=await result;suites.push(report);frame.remove();check(report.status===0&&report.results.some(t=>t.name==='Overall test')&&report.contextLost===true&&report.restored===(name==='context-lost-restored')&&report.results.every(t=>t.status===0),'Original Khronos '+tag+' assertions pass');
 }
}
(async()=>{try{for(const version of ['webgl','webgl2'])for(const offscreen of (typeof OffscreenCanvas==='function'?[false,true]:[false]))await lifecycle(version,offscreen);await upstream();await presentation();}catch(error){checks.push({name:'Lifecycle fixture completes',passed:false,error:String(error),stack:error.stack});}finally{document.querySelector('#status').textContent=JSON.stringify(checks.slice(-4),null,2);await fetch('/report',{method:'POST',body:JSON.stringify({checks,suites,diagnostics:{retained:retained.length,offscreenExposed:typeof OffscreenCanvas==='function'},unadvertisedFeatures:typeof OffscreenCanvas==='function'?[]:['OffscreenCanvas'],scope:'Isolated exposed WebGL1/2 canvas lifecycle (OffscreenCanvas only when advertised), deferred queries, resource generations and original Khronos assertions. Software-rendered test; no hardware-reset or adapter-migration claim.'})});}})();
</script>
