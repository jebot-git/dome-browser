<!doctype html><meta charset=utf-8><title>Private SVG scoped registry isolation</title>
<!-- Throw before super deliberately: failed author constructors must also stay inert in private clones. -->
<script>addEventListener('error',e=>{if(e.message.includes('expected-scoped-failure'))e.preventDefault()});window.constructs=0;window.registry=new CustomElementRegistry;registry.define('scoped-probe',class extends HTMLElement {constructor(){window.constructs++;throw new Error('expected-scoped-failure')}});</script>
<svg width=60 height=60><rect width=60 height=60 fill=green/><foreignObject id=container width=10 height=10></foreignObject></svg>
<script>const el=document.implementation.createHTMLDocument().createElement('scoped-probe');el.id='authored';registry.initialize(el);document.getElementById('container').append(el);const publicClone=el.cloneNode(true);registry.upgrade(publicClone);setTimeout(()=>fetch('/report',{method:'POST',body:JSON.stringify({constructs,checks:[{name:'only authored element and public clone invoke the throwing scoped constructor',passed:constructs===2},{name:'authored scoped registry preserved',passed:document.getElementById('authored').customElementRegistry===registry},{name:'public scoped clone retains its registry',passed:publicClone.customElementRegistry===registry},{name:'only authored scoped element is connected',passed:document.querySelectorAll('scoped-probe').length===1}]})}),1500);</script>
