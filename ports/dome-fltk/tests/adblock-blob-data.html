<!doctype html><title>Blob and data cosmetics</title>
<style nonce=fixture>iframe{width:200px;height:180px;border:0}</style>
<script nonce=fixture>
addEventListener('load',async()=>{
 try{
  const frames=[],seen=new Set();
  addEventListener('message',event=>{
   const data=event.data;
   if(!data||!['http','blob','data','opaque-blob'].includes(data.frame)||seen.has(data.frame))return;
   const frame=document.getElementById(data.frame);if(!frame||frame.contentWindow!==event.source)return;
   seen.add(data.frame);frames.push({...data,messageOrigin:event.origin});
   if(frames.length===4)fetch('/report',{method:'POST',body:JSON.stringify({frames})});
  });
  const html=await(await fetch('/child')).text();
  for(const kind of ['http','blob','data','opaque-blob']){
   const frame=document.createElement('iframe');frame.id=kind;frame.referrerPolicy='no-referrer';
   const body=html.replaceAll('__FRAME_ID__',kind);
   if(kind==='http')frame.src='/child-http';
   else if(kind==='blob'||kind==='opaque-blob')frame.src=URL.createObjectURL(new Blob([body],{type:'text/html'}));
   else frame.src='data:text/html;charset=utf-8,'+encodeURIComponent(body);
   if(kind==='opaque-blob')frame.setAttribute('sandbox','allow-scripts');
   document.body.append(frame);
  }
 }catch(e){fetch('/report',{method:'POST',body:JSON.stringify({error:String(e)})});}
});
</script>
