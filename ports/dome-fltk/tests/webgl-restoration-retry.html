<!doctype html><meta charset="utf-8"><title>WebGL restoration retry</title>
<canvas id="canvas" width="64" height="64"></canvas><script>
let test={},gl,extension,oldBuffer;
function setup(kind,automatic){
 const canvas=document.querySelector('canvas');
 test={kind,automatic,lost:0,restored:0,error:null};
 gl=canvas.getContext(kind,{antialias:false,preserveDrawingBuffer:true});
 test.available=!!gl;if(!gl)return test;
 extension=gl.getExtension('WEBGL_lose_context');test.extension=!!extension;
 oldBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,oldBuffer);gl.bufferData(gl.ARRAY_BUFFER,16,gl.STATIC_DRAW);
 test.originalBuffer=gl.isBuffer(oldBuffer);
 canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();test.lost++;test.lostAt=performance.now();if(!automatic)setTimeout(()=>extension.restoreContext(),0);});
 canvas.addEventListener('webglcontextrestored',()=>{try{
  test.restored++;test.restoredAt=performance.now();test.oldBufferInvalid=!gl.isBuffer(oldBuffer);
  gl.clearColor(0,1,0,1);gl.clear(gl.COLOR_BUFFER_BIT);const pixel=new Uint8Array(4);
  gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);test.pixel=Array.from(pixel);
  test.glError=gl.getError();test.isLost=gl.isContextLost();
 }catch(error){test.error=String(error);}});
 return test;
}
function begin(){if(test.automatic){gl.clear(gl.COLOR_BUFFER_BIT);}else{extension.loseContext();}return true;}
function snapshot(){return {...test,isLost:gl?gl.isContextLost():null};}
</script>
