[package]
name = "dome-browser"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
socket2 = { workspace = true }
servo-base = { workspace = true }
servo = { workspace = true, features = ["baked-in-resources", "js_jit", "webxr", "clipboard", "webcrypto", "media-gstreamer"] }
image = { workspace = true }
webxr = { workspace = true }
webxr-api = { workspace = true }
surfman = { workspace = true }
glow = { workspace = true }
euclid = { workspace = true }
dpi = { workspace = true }
url = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }

adblock = "=0.13.3"
sha2 = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros", "fs"] }
percent-encoding = { workspace = true }
mime_guess = { workspace = true }
mime = { workspace = true }
encoding_rs = { workspace = true }
tokio-rustls = { workspace = true }
x509-cert = "=0.2.5"
language-tags = "=0.3.2"
base64 = { workspace = true }
mail-parser = { version = "=1.0.0", features = ["full_encoding"] }
webpki-roots = { workspace = true }

[dev-dependencies]
gleam = { workspace = true }

[build-dependencies]
cc = { workspace = true }

[[bin]]
name = "dome-browser"
path = "src/main.rs"
