<title>Dome interaction/media regression</title><style>body{margin:0;height:2400px;background:#eef}textarea{position:absolute;left:20px;top:20px;width:200px;height:90px;resize:both;min-width:100px;min-height:40px}#panel{z-index:20;position:fixed;left:320px;top:80px;width:260px;height:150px;background:#fda}#handle{height:26px;background:#acf;cursor:move}#media{position:fixed;bottom:10px;left:20px;height:130px;background:#fff}img,video{width:120px;height:80px}#under{position:absolute;top:400px;left:280px;width:500px;height:600px;background:#ddd}</style><style>#svgIcons{position:fixed;left:810px;top:280px;width:130px;height:40px;background:#000;color:rgb(20,220,80)}#svgIcons svg{width:40px;height:40px;fill:currentColor}.svgHot{fill:rgb(230,40,70)}</style><div id=svgIcons><svg viewBox="0 0 40 40"><path d="M0 0H40V40H0Z"/></svg><svg viewBox="0 0 40 40"><path class=svgHot d="M0 0H40V40H0Z"/></svg><svg viewBox="0 0 40 40"><defs><linearGradient id=paintGradient><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient></defs><path fill="url(#paintGradient)" d="M0 0H40V40H0Z"/></svg></div><textarea id=box>Resizable textarea</textarea><div id=under>Underlying scrolling document</div><iframe src="http://localhost:FRAME_PORT/frame" style="position:fixed;left:300px;top:60px;width:500px;height:190px;z-index:0;border:0"></iframe><div id=panel><div id=handle>Drag this fixed panel</div>Panel content<textarea id=panelBox style="left:10px;top:40px;width:200px;height:70px">Fixed panel textarea</textarea></div><textarea id=locked style="position:fixed;left:620px;top:40px;width:160px;height:50px;resize:none">No resize</textarea><div id=media><img id=staticImage src=/static.webp><img id=animatedImage src=/animated.webp><video id=movie muted loop playsinline src=/test.webm></video><button id=play>Play WebM</button><button id=mp4play>Play MP4</button><br>Media regression</div><script>
function send(v){fetch('/report',{method:'POST',body:JSON.stringify(v)}).catch(()=>{})}
window.onerror=(msg,src,line)=>send({kind:'error',msg:String(msg),line});
let drag=null;
handle.addEventListener('mousedown',e=>{e.preventDefault();const r=panel.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};send({kind:'start',x:e.clientX,y:e.clientY,target:e.target.id})});
document.addEventListener('mousemove',e=>{if(drag){panel.style.left=(e.clientX-drag.x)+'px';panel.style.top=(e.clientY-drag.y)+'px'}});
document.addEventListener('mouseup',()=>drag=null);
for(const name of ['mousedown','mouseup'])document.addEventListener(name,e=>send({kind:name,target:e.target.id,x:e.clientX,y:e.clientY,py:e.pageY,buttons:e.buttons}),true);
play.onclick=()=>movie.play().then(()=>send({kind:'play',ok:true}),e=>send({kind:'play',ok:false,error:String(e)}));
mp4play.onclick=()=>{movie.src='/test.mp4';movie.play().catch(e=>send({kind:'mp4-error',error:String(e)}))};
let canvas=document.createElement('canvas');canvas.width=80;canvas.height=60;let ctx=canvas.getContext('2d');let colors=new Set();
setInterval(()=>{if(animatedImage.complete&&animatedImage.naturalWidth){ctx.drawImage(animatedImage,0,0);colors.add(Array.from(ctx.getImageData(20,20,1,1).data).join(','))}const r=panel.getBoundingClientRect();send({kind:'state',w:innerWidth,h:innerHeight,y:scrollY,bw:box.clientWidth,bh:box.clientHeight,pbw:panelBox.clientWidth,pbh:panelBox.clientHeight,nw:locked.clientWidth,nh:locked.clientHeight,px:r.x,py:r.y,sw:staticImage.naturalWidth,aw:animatedImage.naturalWidth,colors:[...colors],vt:movie.currentTime,vs:movie.readyState,ve:movie.error?movie.error.code:0,screen:[screen.width,screen.height,screen.availWidth,screen.availHeight],outer:[outerWidth,outerHeight],src:movie.currentSrc.split('/').pop(),hls:movie.canPlayType('application/vnd.apple.mpegurl'),mp4:movie.canPlayType('video/mp4; codecs="avc1.42E01E,mp4a.40.2"'),can:movie.canPlayType('video/webm; codecs="vp8"')})},250)
</script>
