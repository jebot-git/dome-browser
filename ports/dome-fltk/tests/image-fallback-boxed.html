<meta charset="utf-8"><title>Native boxed image alternate text</title>
<style>
body{font:16px/20px monospace;background:white;color:black;display:grid;grid-template-columns:repeat(4,280px);gap:10px}
section{height:82px;overflow:visible}p{color:rgb(96,96,96);font:12px/16px monospace;margin:0 0 5px}
img{font:inherit;color:rgb(192,0,0);background:rgb(240,240,240)}
.measure{position:fixed;left:-2000px;top:0;white-space:nowrap;font:16px/20px monospace}
</style>
<script>
addEventListener('unhandledrejection',event=>{fetch('/report',{method:'POST',body:JSON.stringify({checks:[{name:'fixture completes without script rejection',passed:false,error:String(event.reason)}],paint:[],geometry:[]})})});
addEventListener('load',async()=>{
 const checks=[],paint=[],geometry=[];
 const check=(name,passed,error='')=>checks.push({name,passed,error});
 const pause=(ms=100)=>new Promise(r=>setTimeout(r,ms));
 const good='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
 const load=(e,src)=>new Promise(resolve=>{e.onload=()=>resolve('load');e.onerror=()=>resolve('error');e.src=src});
 const size=e=>{const r=e.getBoundingClientRect();return [r.width,r.height]};
 const near=(a,b)=>Math.abs(a-b)<.2;
 const measure=(text,font='16px/20px monospace')=>{const span=document.createElement('span');span.className='measure';span.style.font=font;span.textContent=text;document.body.append(span);return span};
 const label=measure('Fallback label'),word=measure('Fallback');
 const create=(name,css,alt='Fallback label')=>{const host=document.createElement('section'),p=document.createElement('p'),e=document.createElement('img');p.textContent=name;host.append(p,e);document.body.append(host);e.style.cssText=css;if(alt!==null)e.alt=alt;return e};
 const box=(name,e,w,h)=>{const s=size(e);check(name,near(s[0],w)&&near(s[1],h),JSON.stringify(s))};
 const save=(name,e,visible=true,color='red')=>paint.push({name,e,visible,color});
 check('actual quirks document',document.compatMode==='BackCompat');
 const cases=[
 ['fixed','width:200px;height:50px',200,50],['narrow','width:60px;height:50px',60,50],
 ['RTL','width:200px;height:50px;direction:rtl',200,50],['nowrap','width:60px;height:50px;white-space:nowrap',60,50],
 ['large font','width:200px;height:50px;font-size:24px;line-height:30px',200,50],
 ['border and padding','width:200px;height:50px;border:3px solid black;padding:5px',216,66],
 ['hidden','width:200px;height:50px;visibility:hidden',200,50,false],
 ['clipped height','width:200px;height:8px',200,8],['block','display:block;width:200px;height:50px',200,50],
 ['writing-mode declaration','width:200px;height:50px;writing-mode:vertical-rl',200,50],
 ];
 const all=[];await Promise.all(cases.map(async([name,css,w,h,visible=true])=>{const e=create(name,css);check(name+' errors',await load(e,'/not-found?'+name)==='error');all.push([name,e,w,h,visible])}));
 await pause();for(const[name,e,w,h,visible]of all){box(name+' preserves dimensions',e,w,h);save(name,e,visible);check(name+' leaves DOM empty',e.childNodes.length===0&&e.textContent==='')}
 for(const [name,alt,src]of [['empty alt','','/not-found'],['missing alt',null,'/not-found'],['valid image','Fallback label',good]]){const e=create(name,'width:200px;height:50px',alt);await load(e,src);await pause();box(name,e,200,50);save(name,e,false)}
 const replacement=create('CSS replacement',`width:200px;height:50px;content:url("${good}")`);await load(replacement,'/not-found?replacement');await pause();box('CSS replacement',replacement,200,50);save('CSS replacement',replacement,false);
 const minimum=create('min-content','width:min-content');await load(minimum,'/not-found?minimum');await pause();check('min-content uses label word width',near(size(minimum)[0],size(word)[0]),JSON.stringify([size(minimum),size(word)]));check('min-content wraps label into two lines',near(size(minimum)[1],40),JSON.stringify(size(minimum)));save('min-content',minimum);
 const maximum=create('max-content','width:max-content');await load(maximum,'/not-found?maximum');await pause();check('max-content uses label width',near(size(maximum)[0],size(label)[0]),JSON.stringify([size(maximum),size(label)]));box('max-content line height',maximum,size(label)[0],20);save('max-content',maximum);
 const dynamic=create('alt mutation','width:max-content;height:50px');await load(dynamic,'/not-found?dynamic');await pause();const before=size(dynamic)[0];dynamic.alt='Fallback label extended';await pause();check('alt mutation updates intrinsic width',size(dynamic)[0]>before+30,JSON.stringify(size(dynamic)));save('alt mutation',dynamic);
 const color=create('color mutation','width:200px;height:50px');await load(color,'/not-found?color');await pause();color.style.color='rgb(0,128,0)';await pause();save('color mutation',color,true,'green');
 const font=create('font mutation','width:max-content;height:50px');await load(font,'/not-found?font');await pause();const oldFont=size(font)[0];font.style.fontSize='24px';font.style.lineHeight='30px';await pause();check('font mutation refreshes intrinsic width',size(font)[0]>oldFont+30,JSON.stringify(size(font)));save('font mutation',font);
 const empty=create('empty alt mutation','width:200px;height:50px');await load(empty,'/not-found?empty');await pause();empty.alt='';await pause();box('empty mutation preserves dimensions',empty,200,50);save('empty alt mutation',empty,false);
 const toValid=create('broken to valid','width:200px;height:50px');await load(toValid,'/not-found?to-valid');await pause();await load(toValid,good);await pause();box('broken to valid preserves dimensions',toValid,200,50);save('broken to valid',toValid,false);
 const toBroken=create('valid to broken','width:200px;height:50px');await load(toBroken,good);await load(toBroken,'/not-found?to-broken');await pause();box('valid to broken preserves dimensions',toBroken,200,50);save('valid to broken',toBroken);
 const late=create('late font','width:max-content;height:50px;font-family:DomeFallbackLate,monospace');await load(late,'/not-found?late-font');await pause();const beforeLate=size(late)[0];
 const fontRule=document.createElement('style');fontRule.textContent='@font-face{font-family:DomeFallbackLate;src:url(data:font/ttf;base64,__FONT_DATA__)}';document.head.append(fontRule);size(late);await document.fonts.ready;await pause(500);
 const lateControl=measure('Fallback label','16px/20px DomeFallbackLate,monospace');await pause();check('font availability refreshes intrinsic width',Math.abs(size(late)[0]-beforeLate)>2&&near(size(late)[0],size(lateControl)[0]),JSON.stringify([beforeLate,size(late),size(lateControl)]));save('late font',late);
 check('all image author DOM remains empty',[...document.querySelectorAll('img')].every(e=>e.childNodes.length===0&&e.textContent===''));
 await pause();const finalPaint=paint.map(({name,e,visible,color})=>{const r=e.getBoundingClientRect(),host=e.parentElement.getBoundingClientRect();geometry.push({name,rect:[r.width,r.height]});return {name,writingMode:getComputedStyle(e).writingMode,rect:[r.x,r.y,r.width,r.height],host:[host.x,host.y,host.width,host.height],visible,color}});fetch('/report',{method:'POST',body:JSON.stringify({checks,paint:finalPaint,geometry,capabilities:{fontFaceConstructor:typeof FontFace,verticalWriting:CSS.supports("writing-mode","vertical-rl")}})});
});
</script>
