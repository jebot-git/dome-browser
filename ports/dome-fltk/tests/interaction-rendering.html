<title>Dome interaction/rendering regression</title><style>body{margin:0;height:2400px;background:#eef}textarea{position:absolute;left:20px;top:20px;width:200px;height:90px;resize:both;min-width:100px;min-height:40px}#panel{z-index:20;position:fixed;left:320px;top:80px;width:260px;height:150px;background:#fda}#handle{height:26px;background:#acf;cursor:move}#media{position:fixed;bottom:10px;left:20px;height:130px;background:#fff}img{width:120px;height:80px}#under{position:absolute;top:400px;left:280px;width:500px;height:600px;background:#ddd}</style><style>#svgIcons{position:fixed;left:810px;top:280px;width:130px;height:40px;background:#000;color:rgb(20,220,80)}#svgIcons svg{width:40px;height:40px;fill:currentColor}.svgHot{fill:rgb(230,40,70)}</style><div id=svgIcons><svg viewBox="0 0 40 40"><path d="M0 0H40V40H0Z"/></svg><svg viewBox="0 0 40 40"><path class=svgHot d="M0 0H40V40H0Z"/></svg><svg viewBox="0 0 40 40"><defs><linearGradient id=paintGradient><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient></defs><path fill="url(#paintGradient)" d="M0 0H40V40H0Z"/></svg></div><textarea id=box>Resizable textarea</textarea><div id=under>Underlying scrolling document</div><iframe src="http://localhost:FRAME_PORT/frame" style="position:fixed;left:300px;top:60px;width:500px;height:190px;z-index:0;border:0"></iframe><div id=panel><div id=handle>Drag this fixed panel</div>Panel content<textarea id=panelBox style="left:10px;top:40px;width:200px;height:70px">Fixed panel textarea</textarea></div><textarea id=locked style="position:fixed;left:620px;top:40px;width:160px;height:50px;resize:none">No resize</textarea><div id=media><img id=staticImage src=/static.webp><img id=animatedImage src=/animated.webp><br>Image rendering regression</div><script>
function send(v){fetch('/report',{method:'POST',body:JSON.stringify(v)}).catch(()=>{})}
window.onerror=(msg,src,line)=>send({kind:'error',msg:String(msg),line});
let drag=null;
handle.addEventListener('mousedown',e=>{e.preventDefault();const r=panel.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};send({kind:'start',x:e.clientX,y:e.clientY,target:e.target.id})});
document.addEventListener('mousemove',e=>{if(drag){panel.style.left=(e.clientX-drag.x)+'px';panel.style.top=(e.clientY-drag.y)+'px'}});
document.addEventListener('mouseup',()=>drag=null);
for(const name of ['mousedown','mouseup'])document.addEventListener(name,e=>send({kind:name,target:e.target.id,x:e.clientX,y:e.clientY,py:e.pageY,buttons:e.buttons}),true);
let canvas=document.createElement('canvas');canvas.width=80;canvas.height=60;let ctx=canvas.getContext('2d');let colors=new Set();
setInterval(()=>{if(animatedImage.complete&&animatedImage.naturalWidth){ctx.drawImage(animatedImage,0,0);colors.add(Array.from(ctx.getImageData(20,20,1,1).data).join(','))}const r=panel.getBoundingClientRect();send({kind:'state',resizeSyntax:CSS.supports('resize','both'),resizeValue:getComputedStyle(box).resize,overflow:getComputedStyle(box).overflow,compatGrips:[...document.querySelectorAll('[aria-hidden=true]')].filter(e=>e.style.zIndex==='2147483647').length,grip:(()=>{const g=[...document.querySelectorAll('[aria-hidden=true]')].find(e=>e.style.zIndex==='2147483647');return g?{display:getComputedStyle(g).display,rect:g.getBoundingClientRect().toJSON(),pointer:getComputedStyle(g).pointerEvents,clip:getComputedStyle(g).clipPath}:null})(),w:innerWidth,h:innerHeight,y:scrollY,bw:box.clientWidth,bh:box.clientHeight,pbw:panelBox.clientWidth,pbh:panelBox.clientHeight,nw:locked.clientWidth,nh:locked.clientHeight,px:r.x,py:r.y,sw:staticImage.naturalWidth,aw:animatedImage.naturalWidth,colors:[...colors],screen:[screen.width,screen.height,screen.availWidth,screen.availHeight],outer:[outerWidth,outerHeight]})},250)
</script>
