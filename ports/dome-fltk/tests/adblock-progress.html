<!doctype html><meta charset=utf-8><title>Cosmetic progress fixture</title>
<style nonce=fixture>.ad{display:block!important} #legitimate{position:fixed;width:40px;height:40px;background:lime}</style>
<div class=ad id=advertisement>Ad</div><div id=legitimate>Control</div>
<script nonce=fixture>
(async()=>{
 const fragment=document.createDocumentFragment();
 for(let i=0;i<4000;i++){const n=document.createElement('span');n.className='content-'+i;n.textContent='Content ';fragment.append(n)}
 document.body.append(fragment);
 const begun=performance.now(),times=[];let reads=0;
 for(let i=0;i<60;i++){
  await new Promise(resolve=>requestAnimationFrame(resolve));
  const node=document.getElementById('legitimate');
  node.className='frame-'+i;node.style.transform='translateX('+i+'px)';
  if(getComputedStyle(node).display!=='none'&&node.getBoundingClientRect().width===40)reads++;
  times.push(performance.now());
 }
 await new Promise(resolve=>setTimeout(resolve,100));
 const gaps=times.slice(1).map((t,i)=>t-times[i]).sort((a,b)=>a-b);
 fetch('/report',{method:'POST',body:JSON.stringify({reads,elapsed:performance.now()-begun,
  median_gap:gaps[Math.floor(gaps.length/2)],max_gap:gaps[gaps.length-1],
  ad:getComputedStyle(document.getElementById('advertisement')).display,
  count:document.querySelectorAll('span').length})});
})().catch(e=>fetch('/report',{method:'POST',body:JSON.stringify({error:String(e)})}));
</script>
