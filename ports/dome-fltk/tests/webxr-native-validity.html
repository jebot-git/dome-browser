<!doctype html><meta charset=utf-8><title>WebXR reference-space integration</title>
<style>body{background:#202830;color:white;font:20px monospace}button{padding:20px;background:#305ac0;color:white}</style>
<h1>Native tracking lifecycle</h1><button id=start disabled>Start tracking test</button><button id=end disabled>End session</button><canvas id=canvas width=128 height=96></canvas>
<script>
'use strict';const start=document.getElementById('start'),end=document.getElementById('end'),canvas=document.getElementById('canvas');
let order=0,frameCount=0,resetSerial=0,session=null,ended=false,lastFrame=null,busy=false,viewer,local,floor;
const report=(type,data={})=>fetch('/event',{method:'POST',body:JSON.stringify({order:++order,type,data})});
const fail=e=>report('error',{message:String(e),stack:e?.stack});
const pose=p=>p?{position:[p.transform.position.x,p.transform.position.y,p.transform.position.z],emulated:p.emulatedPosition,orientation:[p.transform.orientation.x,p.transform.orientation.y,p.transform.orientation.z,p.transform.orientation.w],has_velocity:p.linearVelocity!==null||p.angularVelocity!==null}:null;
const gl=canvas.getContext('webgl',{xrCompatible:true});
gl.makeXRCompatible().then(()=>{start.disabled=false;report('ready',{start:start.getBoundingClientRect().toJSON(),end:end.getBoundingClientRect().toJSON(),viewport:[innerWidth,innerHeight],ratio:devicePixelRatio});}).catch(fail);
start.onclick=async()=>{try{
 session=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor']});start.disabled=true;end.disabled=false;
 session.onend=()=>{ended=true;report('ended');};
 [viewer,local,floor]=await Promise.all(['viewer','local','local-floor'].map(t=>session.requestReferenceSpace(t)));
 local.onreset=floor.onreset=()=>resetSerial++;
 for(const name of ['selectstart','selectend','select'])session.addEventListener(name,e=>{try{report('input',{name,ordinary:pose(e.frame.getPose(viewer,local))});}catch(e){fail(e);}});
 const layer=new XRWebGLLayer(session,gl);session.updateRenderState({baseLayer:layer});
 const frame=(time,f)=>{try{
  frameCount++;const self=f.getViewerPose(viewer),localPose=f.getViewerPose(local);
  lastFrame={frameCount,resetSerial,local:pose(localPose),world_views:localPose?localPose.views.map(v=>({position:[v.transform.position.x,v.transform.position.y,v.transform.position.z]})):[],input_pose_available:session.inputSources.length?f.getPose(session.inputSources[0].targetRaySpace,local)!==null:null,floor:pose(f.getViewerPose(floor)),self:pose(self),ordinary:pose(f.getPose(viewer,local)),eyes:self?self.views.map(v=>v.eye):[],views:self?self.views.map(v=>({position:[v.transform.position.x,v.transform.position.y,v.transform.position.z]})):[],viewports:self?self.views.map(v=>layer.getViewport(v)!==null):[]};
  if(frameCount===2)report('running');if(frameCount%4===0)report('frame',lastFrame);
  gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.clearColor(.1,.2,.4,1);gl.clear(gl.COLOR_BUFFER_BIT);session.requestAnimationFrame(frame);
 }catch(e){fail(e);}};session.requestAnimationFrame(frame);
}catch(e){fail(e);}};
async function command(op){if(op==='end'){await session.end();end.disabled=true;}report('command',{op});}
setInterval(async()=>{if(busy)return;busy=true;try{const op=await(await fetch('/command')).json();if(op)await command(op);}catch(e){fail(e);}finally{busy=false;}report('heartbeat',{frameCount,resetSerial,lastFrame,ended});},60);
addEventListener('error',e=>fail(e.message));
</script>
