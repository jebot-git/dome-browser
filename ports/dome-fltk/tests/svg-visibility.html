<!doctype html><meta charset="utf-8"><title>SVG visibility inheritance and overrides</title>
<style>
body{margin:0;background:white}svg{position:absolute;top:20px;width:60px;height:60px}
#rootCSS{visibility:hidden}#rootCSS rect{visibility:visible}
#groupCSS g{visibility:hidden}#groupCSS rect{visibility:visible}
</style>
<svg id="rootAttr" visibility="hidden" style="left:20px"><rect visibility="visible" width="60" height="60" fill="#14b45a"/></svg>
<svg id="rootCSS" style="left:100px"><rect width="60" height="60" fill="#14b45a"/></svg>
<svg id="groupAttr" style="left:180px"><g visibility="hidden"><rect visibility="visible" width="60" height="60" fill="#14b45a"/></g></svg>
<svg id="groupCSS" style="left:260px"><g><rect width="60" height="60" fill="#14b45a"/></g></svg>
<div style="visibility:hidden"><svg id="htmlParent" visibility="visible" style="left:340px"><rect width="60" height="60" fill="#14b45a"/></svg></div>
<svg id="rootHidden" visibility="hidden" style="left:420px"><rect width="60" height="60" fill="#14b45a"/></svg>
<svg id="groupHidden" style="left:500px"><g visibility="hidden"><rect width="60" height="60" fill="#14b45a"/></g></svg>
<svg id="childHidden" style="left:580px"><rect visibility="hidden" width="60" height="60" fill="#14b45a"/></svg>
<img id="hiddenImage" width="60" height="60" style="position:absolute;left:660px;top:20px;visibility:hidden" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2260%22%20height%3D%2260%22%20visibility%3D%22hidden%22%3E%3Crect%20visibility%3D%22visible%22%20width%3D%2260%22%20height%3D%2260%22%20fill%3D%22%2314b45a%22/%3E%3C/svg%3E">
<img id="visibleImage" width="60" height="60" style="position:absolute;left:740px;top:20px" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2260%22%20height%3D%2260%22%20visibility%3D%22hidden%22%3E%3Crect%20visibility%3D%22visible%22%20width%3D%2260%22%20height%3D%2260%22%20fill%3D%22%2314b45a%22/%3E%3C/svg%3E">
<script>
addEventListener('load',()=>setTimeout(()=>fetch('/report',{method:'POST',body:JSON.stringify({checks:[{name:'visibility fixture loaded',passed:true}],styles:[...document.querySelectorAll('svg')].map(svg=>({id:svg.id,root:getComputedStyle(svg).visibility,child:getComputedStyle(svg.querySelector('rect')).visibility}))})}),400));
