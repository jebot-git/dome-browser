<!doctype html>
<html class="reftest-wait">
<meta charset="utf-8">
<title>SVG gradient stop CSS cascade and repaint</title>
<link rel="help" href="https://svgwg.org/svg2-draft/pservers.html#StopColorProperties">
<link rel="match" href="svg-gradient-stop-style-ref.html">
<meta name="assert" content="Gradient stops use the CSS cascade, currentColor, non-inherited initial values and changed CSSOM stop color/opacity.">
<style>
body { margin: 0 }
svg { display: inline-block; vertical-align: top; width: 100px; height: 100px }
#sheet stop { stop-color: green }
#current { color: green }
#current stop { stop-color: currentColor }
#default linearGradient { stop-color: red; stop-opacity: 0 }
#dynamic stop { stop-color: red; stop-opacity: 0 }
</style>
<script>
const rules = document.styleSheets[0];
for (const id of ['attribute','sheet','current','default','dynamic']) {
 const attribute = id === 'attribute' ? 'stop-color="green"' : id === 'sheet' ? 'stop-color="red"' : '';
 document.write(`<svg id="${id}" viewBox="0 0 100 100"><defs><linearGradient id="g-${id}"><stop offset="0" ${attribute}/><stop offset="1" ${attribute}/></linearGradient></defs><rect width="100" height="100" fill="url(#g-${id})"/></svg>`);
}
window.addEventListener('load', () => {
 requestAnimationFrame(() => requestAnimationFrame(() => {
  const rule = rules.cssRules[rules.cssRules.length - 1];
  rule.style.stopColor = 'green';
  rule.style.stopOpacity = '1';
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait')));
 }));
});
</script>
</html>
