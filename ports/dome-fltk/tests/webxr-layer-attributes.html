<!doctype html><meta charset="utf-8"><title>WebXR layer buffers</title>
<style>body{background:#11334c;color:white;font:18px monospace}button{padding:18px}canvas{width:220px;height:120px}</style>
<button id="start">Start layer buffer validation</button><canvas id="one" width="240" height="120"></canvas><canvas id="two" width="240" height="120"></canvas>
<script>
let order=0;const post=(type,data)=>fetch('/event',{method:'POST',body:JSON.stringify({order:++order,type,data})});
const rect=v=>({x:v.x,y:v.y,width:v.width,height:v.height});
function program(gl,version){
 const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s};
 const modern=version==='webgl2',p=gl.createProgram();
 gl.attachShader(p,shader(gl.VERTEX_SHADER,(modern?'#version 300 es\nin':'attribute')+' vec2 position;void main(){gl_Position=vec4(position,0.,1.);}'));
 gl.attachShader(p,shader(gl.FRAGMENT_SHADER,(modern?'#version 300 es\n':'')+'precision highp float;uniform vec4 color;'+(modern?'out vec4 result;':'')+'void main(){'+(modern?'result':'gl_FragColor')+'=color;}'));
 gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const position=gl.getAttribLocation(p,'position');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
 return gl.getUniformLocation(p,'color');
}
function poison(gl){
 gl.clearColor(.2,.3,.4,.5);gl.clearDepth(0);gl.clearStencil(99);
 gl.colorMask(false,false,false,false);gl.depthMask(false);
 gl.stencilMaskSeparate(gl.FRONT,0);gl.stencilMaskSeparate(gl.BACK,3);
 gl.scissor(0,0,0,0);gl.enable(gl.SCISSOR_TEST);
}
start.onclick=async()=>{
 try{
  const session=await navigator.xr.requestSession('immersive-vr'),space=await session.requestReferenceSpace('local');
  for(const version of ['webgl','webgl2'])for(const antialias of [false,true]){
   const canvas=document.createElement('canvas');canvas.width=80;canvas.height=40;
   const gl=canvas.getContext(version,{antialias});if(!gl)throw Error(version+' inline context unavailable');
   const session=await navigator.xr.requestSession('inline');
   const layer=new XRWebGLLayer(session,gl,{antialias:!gl.getContextAttributes().antialias,alpha:false,depth:false,stencil:true,ignoreDepthValues:false,framebufferScaleFactor:4});
   post('inline',{version,requested:antialias,actual:gl.getContextAttributes(),antialias:layer.antialias,ignoreDepthValues:layer.ignoreDepthValues,framebuffer:layer.framebuffer,size:[layer.framebufferWidth,layer.framebufferHeight]});
   await session.end();
  }
  let phase=0;
  for(const version of ['webgl','webgl2']){
   const gl=document.querySelector(version==='webgl'?'#one':'#two').getContext(version,{xrCompatible:true,alpha:location.hash!=='#opaque-context',premultipliedAlpha:location.hash!=='#opaque-context',depth:true,stencil:true,preserveDrawingBuffer:true});
   if(!gl)throw Error(version+' context unavailable');await gl.makeXRCompatible();const color=program(gl,version);
   gl.activeTexture(gl.TEXTURE3);const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,4,4,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
   let unpack=null;
   if(version==='webgl2'){unpack=gl.createBuffer();gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER,unpack);gl.bufferData(gl.PIXEL_UNPACK_BUFFER,4,gl.STATIC_DRAW)}
   for(const alpha of [false,true])for(const depth of [false,true])for(const stencil of [false,true])for(const antialias of [false,true]){
    const marker=16+phase++,options={alpha,depth,stencil,antialias,ignoreDepthValues:false,framebufferScaleFactor:.5};
    const layer=new XRWebGLLayer(session,gl,options),initialSize=[layer.framebufferWidth,layer.framebufferHeight];
    post('allocation',{version,marker,texturePreserved:gl.getParameter(gl.TEXTURE_BINDING_2D)===texture,unitPreserved:gl.getParameter(gl.ACTIVE_TEXTURE)===gl.TEXTURE3,unpackPreserved:version!=='webgl2'||gl.getParameter(gl.PIXEL_UNPACK_BUFFER_BINDING)===unpack,error:gl.getError()});
    session.updateRenderState({baseLayer:layer});poison(gl);
    // Keep the opaque framebuffer and masks across a native implicit clear.
    // Observe actual stencil-dependent drawing: getParameter uses WebGL's
    // shadow state and cannot by itself prove preservation of the native mask.
    if(stencil){
     await new Promise((resolve,reject)=>session.requestAnimationFrame(()=>{
      try{
       gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
       gl.disable(gl.SCISSOR_TEST);gl.disable(gl.DEPTH_TEST);gl.enable(gl.STENCIL_TEST);
       gl.colorMask(true,true,true,true);gl.depthMask(false);
       gl.stencilMask(0xa5a55a5a);gl.stencilFunc(gl.EQUAL,0x5a,255);gl.stencilOp(gl.KEEP,gl.KEEP,gl.KEEP);
       gl.viewport(0,0,layer.framebufferWidth,layer.framebufferHeight);
       gl.uniform4f(color,0,1,9/255,1);setTimeout(resolve,0);
      }catch(e){reject(e)}
     }));
     await new Promise((resolve,reject)=>session.requestAnimationFrame(()=>{
      try{
       gl.clearStencil(255);gl.clear(gl.STENCIL_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);
       const pixel=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
       post('full-mask',{version,marker,pixel:[...pixel],error:gl.getError()});
       gl.disable(gl.STENCIL_TEST);poison(gl);gl.bindFramebuffer(gl.FRAMEBUFFER,null);setTimeout(resolve,0);
      }catch(e){reject(e)}
     }));
    }
    for(let index=0;index<3;index++){
     await new Promise((resolve,reject)=>session.requestAnimationFrame((time,frame)=>{
      try{
       const state={colorMask:gl.getParameter(gl.COLOR_WRITEMASK),depthMask:gl.getParameter(gl.DEPTH_WRITEMASK),frontMask:gl.getParameter(gl.STENCIL_WRITEMASK),backMask:gl.getParameter(gl.STENCIL_BACK_WRITEMASK),scissor:gl.isEnabled(gl.SCISSOR_TEST),scissorBox:[...gl.getParameter(gl.SCISSOR_BOX)],clearColor:[...gl.getParameter(gl.COLOR_CLEAR_VALUE)],clearDepth:gl.getParameter(gl.DEPTH_CLEAR_VALUE),clearStencil:gl.getParameter(gl.STENCIL_CLEAR_VALUE)};
       gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
       // With the previous frame's zero write masks still active, an explicit
       // clear must preserve the fresh contents, depth=1 and stencil=0.
       gl.disable(gl.SCISSOR_TEST);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT|gl.STENCIL_BUFFER_BIT);
       const initial=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,initial);
       const bits=[gl.getParameter(gl.ALPHA_BITS),gl.getParameter(gl.DEPTH_BITS),gl.getParameter(gl.STENCIL_BITS)],samples=gl.getParameter(gl.SAMPLES),status=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
       gl.disable(gl.SCISSOR_TEST);gl.colorMask(true,true,true,true);gl.depthMask(true);gl.stencilMask(255);
       gl.depthFunc(gl.LESS);gl.stencilFunc(gl.EQUAL,0,255);gl.stencilOp(gl.KEEP,gl.KEEP,gl.KEEP);
       if(depth||stencil){gl.enable(gl.DEPTH_TEST);gl.enable(gl.STENCIL_TEST)}else{gl.disable(gl.DEPTH_TEST);gl.disable(gl.STENCIL_TEST)}
       const pose=frame.getViewerPose(space);if(!pose)throw Error('No viewer pose');const views=[],pixels=[];
       for(const view of pose.views){
        const v=layer.getViewport(view),left=view.eye==='left',value=alpha?64:255;views.push({eye:view.eye,...rect(v)});
        gl.viewport(v.x,v.y,v.width,v.height);gl.uniform4f(color,left?value/255:0,left?0:value/255,marker/255,64/255);gl.drawArrays(gl.TRIANGLES,0,3);
        const pixel=new Uint8Array(4);gl.readPixels(v.x+Math.floor(v.width/2),v.y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);pixels.push([...pixel]);
       }
       post('buffer',{version,marker,index,options,initial:[...initial],initialSize,size:[layer.framebufferWidth,layer.framebufferHeight],bits,samples,status,state,antialias:layer.antialias,ignoreDepthValues:layer.ignoreDepthValues,views,pixels,error:gl.getError()});
       gl.clearDepth(0);gl.clearStencil(99);gl.clear(gl.DEPTH_BUFFER_BIT|gl.STENCIL_BUFFER_BIT);poison(gl);
       gl.bindFramebuffer(gl.FRAMEBUFFER,null);setTimeout(resolve,0);
      }catch(e){reject(e)}
     }));
     post('after',{version,marker,index,size:[layer.framebufferWidth,layer.framebufferHeight],error:gl.getError()});
    }
   }
  }
  await session.end();post('done',{phases:phase});
 }catch(e){post('error',{name:e.name,message:e.message,stack:e.stack})}
};
addEventListener('load',()=>post('ready',{start:rect(start.getBoundingClientRect()),viewport:[innerWidth,innerHeight],ratio:devicePixelRatio}));
</script>
